name: Release

# Builds the Android release signed with the upload key, for downloading and uploading to the
# Play Console by hand. Run it from the Actions tab (or push a `v*` tag); the files are on the
# run's page afterwards.
#
# Play takes an Android App Bundle, not an APK, so the .aab is the file to upload. The signed APK
# is there for installing on a device. The R8 mapping file is kept too, because crash reports from
# this build are unreadable without it.
#
# Secrets (Settings > Secrets and variables > Actions):
#   UPLOAD_KEYSTORE_BASE64    upload_key.jks, base64-encoded
#   UPLOAD_KEYSTORE_PASSWORD  its store password
#   UPLOAD_KEY_PASSWORD       the key's password, only if it differs from the store password
#   POSTHOG_CLI_API_KEY       a PostHog personal API key with "error tracking write" and
#                             "organization read" scopes, for uploading the R8 mapping file
# The alias is `upload`.
#
# Variables (same page, Variables tab):
#   POSTHOG_CLI_HOST          https://eu.posthog.com
#   POSTHOG_CLI_PROJECT_ID    the numeric PostHog project id
#
# The PostHog Gradle plugin uploads the mapping file during the release build. It is applied only
# when the credentials are set and posthog-cli is on PATH (see docs/error-reporting.md), so this
# workflow installs the CLI and passes the credentials in.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Signed release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # The runner image ships the Android SDK. compileSdk is 37, which it does not carry yet, so the
      # platform and build tools are installed here. `yes` answers the license prompt.
      - name: Install the SDK platform and build tools
        run: |
          sdkmanager="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)"
          yes | "$sdkmanager" --licenses > /dev/null || true
          yes | "$sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0"

      # Pinned so a release build does not change under us when PostHog publishes a new CLI.
      - name: Install posthog-cli
        run: npm install -g @posthog/cli@0.18.10

      - name: Check the PostHog credentials are set
        env:
          POSTHOG_CLI_HOST: ${{ vars.POSTHOG_CLI_HOST }}
          POSTHOG_CLI_PROJECT_ID: ${{ vars.POSTHOG_CLI_PROJECT_ID }}
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
        run: |
          missing=0
          for name in POSTHOG_CLI_HOST POSTHOG_CLI_PROJECT_ID POSTHOG_CLI_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set, so the mapping file would not reach PostHog."
              missing=1
            fi
          done
          exit "$missing"

      - name: Decode the upload keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::error::The UPLOAD_KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload_key.jks"

      - name: Build the signed bundle and APK
        env:
          AUTOSKOLA_KEYSTORE_FILE: ${{ runner.temp }}/upload_key.jks
          AUTOSKOLA_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          AUTOSKOLA_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          AUTOSKOLA_KEY_ALIAS: upload
          POSTHOG_CLI_HOST: ${{ vars.POSTHOG_CLI_HOST }}
          POSTHOG_CLI_PROJECT_ID: ${{ vars.POSTHOG_CLI_PROJECT_ID }}
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
        # The Slovak app alone: the Czech one has no Play listing or AdMob app yet (plans/czech-tests.md).
        run: ./gradlew :app:androidApp:bundleSkRelease :app:androidApp:assembleSkRelease

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload_key.jks"

      - name: Check the APK is signed
        run: |
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$apksigner" verify --print-certs app/androidApp/build/outputs/apk/sk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: app/androidApp/build/outputs/bundle/skRelease/*.aab
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/androidApp/build/outputs/apk/sk/release/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: release-mapping
          path: app/androidApp/build/outputs/mapping/skRelease/mapping.txt
          if-no-files-found: warn
