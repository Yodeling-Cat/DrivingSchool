name: Android

# Compiles the Android app on Linux. Linting comes first and the compile needs it, so a style or
# lint slip stops the workflow before the slow part starts.
#
# The compile check is `assembleDebug`: packaging the APK is how Gradle proves the whole variant
# built — resources, manifest and Kotlin together — and nothing uploads the result, so it never
# leaves the runner.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      # The runner image ships the Android SDK. compileSdk is 37, which it does not carry yet, so the
      # platform and build tools are installed here. `yes` answers the license prompt.
      - name: Install the SDK platform and build tools
        run: |
          sdkmanager="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)"
          yes | "$sdkmanager" --licenses > /dev/null || true
          yes | "$sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: Android Lint
        run: ./gradlew :app:androidApp:lintDebug

  build:
    name: Compile
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      # The runner image ships the Android SDK. compileSdk is 37, which it does not carry yet, so the
      # platform and build tools are installed here. `yes` answers the license prompt.
      - name: Install the SDK platform and build tools
        run: |
          sdkmanager="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)"
          yes | "$sdkmanager" --licenses > /dev/null || true
          yes | "$sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Assemble the debug build
        run: ./gradlew :app:androidApp:assembleDebug
