name: Release

# Builds the Android release signed with the upload key, for downloading and uploading to the
# Play Console by hand. Run it from the Actions tab (or push a `v*` tag); the files are on the
# run's page afterwards.
#
# Play takes an Android App Bundle, not an APK, so the .aab is the file to upload. The signed APK
# is there for installing on a device. The R8 mapping file is kept too, because crash reports from
# this build are unreadable without it.
#
# Secrets (Settings > Secrets and variables > Actions):
#   UPLOAD_KEYSTORE_BASE64    upload_key.jks, base64-encoded
#   UPLOAD_KEYSTORE_PASSWORD  its store password
#   UPLOAD_KEY_PASSWORD       the key's password, only if it differs from the store password
# The alias is `upload`.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Signed release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3
      - name: Install the SDK platform and build tools
        run: yes | sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Decode the upload keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::error::The UPLOAD_KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload_key.jks"

      - name: Build the signed bundle and APK
        env:
          AUTOSKOLA_KEYSTORE_FILE: ${{ runner.temp }}/upload_key.jks
          AUTOSKOLA_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          AUTOSKOLA_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          AUTOSKOLA_KEY_ALIAS: upload
        run: ./gradlew :app:androidApp:bundleRelease :app:androidApp:assembleRelease

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload_key.jks"

      - name: Check the APK is signed
        run: |
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$apksigner" verify --print-certs app/androidApp/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: app/androidApp/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: release-mapping
          path: app/androidApp/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
