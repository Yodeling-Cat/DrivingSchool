<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--
      The app draws one palette and it is a light one (see NajAutoskolaTheme in the shared module), so
      the browser is told not to go dark behind it. "only light" is what forbids it: plain "light"
      still lets a browser in dark mode repaint the page itself (Chrome's auto dark turns it black),
      where "only" rules that out, and the canvas, the scrollbars and our controls stay light.
      theme-color tints the browser's own chrome - the address bar, and the status bar area above it
      on a phone - with the paper the app opens on. A dark palette would have to follow here too.
    -->
    <meta name="color-scheme" content="only light">
    <meta name="theme-color" content="#FFF8EE">
    <title>Naj Autoškola</title>
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link type="text/css" rel="stylesheet" href="styles.css">
</head>
<body style="text-align: center; align-content: center">
    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50" role="presentation">
        <circle cx="25" cy="25" r="20" stroke="#ccc" stroke-width="4" fill="none"/>
        <circle cx="25" cy="25" r="20" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"
                stroke-dasharray="90 125">
            <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s"
                              repeatCount="indefinite"/>
        </circle>
    </svg>
    <script type="module" src="webApp.js"></script>
</body>
</html>
