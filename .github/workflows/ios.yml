name: iOS

# Compiles the iOS app on a macOS runner. Kotlin/Native cannot build Apple targets anywhere else,
# and the runner has to be arm64: the shared module declares iosArm64 and iosSimulatorArm64 only,
# so an Intel runner has no target it could link.
#
# Linting comes first and the build needs it, so a style slip stops the workflow before the slow
# Kotlin/Native compile starts. The Kotlin sources are linted in the Android workflow only — same
# files, same ktlint, and both workflows run on the same events, so doing it here would just be the
# same check twice. See `xcodebuild` below for what "compiles cleanly" means: Swift and Clang
# warnings are errors, so a new warning fails the job.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

  build:
    name: Build
    needs: lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # IPHONEOS_DEPLOYMENT_TARGET is 18.2 and the project is objectVersion 77, so 16.2 or
          # newer is required.
          xcode-version: "16.4"

      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          # The Xcode build phase shells out to ./gradlew, and the Gradle daemon is pinned to
          # Corretto 21 (gradle/gradle-daemon-jvm.properties). Having it installed here keeps Gradle
          # from trying to download it.
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Read the Kotlin version
        id: kotlin
        run: |
          version=$(grep -m1 '^kotlin = ' gradle/libs.versions.toml | cut -d '"' -f2)
          echo "Kotlin $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # ~800 MB of Kotlin/Native toolchain, downloaded by the Gradle build the Xcode build phase
      # runs. Keyed on the Kotlin version rather than a static name: a stale toolchain that no
      # longer matches the compiler is worse than a cache miss, and the old entry stays behind.
      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.kotlin.outputs.version }}

      # The Xcode project's first build phase runs
      # `./gradlew :app:shared:embedAndSignAppleFrameworkForXcode`, so this one command compiles the
      # Swift target and links the Kotlin framework into it.
      #
      # Signing is off: Configuration/Config.xcconfig leaves TEAM_ID empty, and nothing here is
      # installed on a device. The iosApp target's own build settings turn warnings into errors.
      # They are not passed here: a command-line setting also reaches the PostHog package, which
      # suppresses its own warnings and so fails with conflicting options.
      - name: Build the app
        run: |
          xcodebuild build \
            -project app/iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/derived-data" \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      # The Clang static analyzer. Xcode itself has no linter beyond the compiler's warnings, and
      # this is the closest thing to one. It reuses the build above, so it only re-analyzes.
      - name: Static analyzer
        run: |
          xcodebuild analyze \
            -project app/iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/derived-data" \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
